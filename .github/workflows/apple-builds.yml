name: apple-builds
on:
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build macos --debug
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: runway-macos
          path: app/build/macos/Build/Products/Debug/*.app
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build ios --debug --no-codesign
        working-directory: app
