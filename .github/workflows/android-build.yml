name: android-build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-build.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build apk --debug --dart-define=DIAG_ENDPOINT=https://dada561.com/diag/ingest --dart-define=DIAG_TOKEN=${{ secrets.DIAG_TOKEN }} --dart-define=DIAG_EXPIRY_MS=1793109600000
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: runway-android-debug
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
